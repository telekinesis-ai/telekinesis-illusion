name: Release

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build Package
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11.17"

      - name: Install package and build tools
        run: python -m pip install ".[dev]" build twine

      # shortcut: lint checks are omitted, TODO: configure and validate Ruff
      # and Pylint before re-enabling them.

      - name: Run quickstart and worker examples
        # shortcut: tests are skipped, TODO: re-enable after CPU runner validation.
        if: ${{ false }}
        run: python -m pytest tests/test_examples.py

      - name: Build package
        run: |
          rm -rf dist build *.egg-info
          python -m build
          python -m twine check dist/*

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-dist
          path: dist/
          retention-days: 7

  publish-testpypi:
    name: Publish to Test PyPI
    runs-on: ubuntu-latest
    needs: build
    environment: testpypi
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: release-dist
          path: dist/

      - name: Publish to Test PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          verbose: true

  verify-testpypi:
    name: Verify Test PyPI Install (Python 3.11)
    runs-on: ubuntu-latest
    needs: publish-testpypi
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11.17"

      - name: Download wheel from Test PyPI with retries
        run: |
          VERSION=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          echo "Verifying version $VERSION"

          for i in 1 2 3; do
            echo "Attempt $i..."
            if python -m pip download \
              --no-cache-dir \
              --no-deps \
              --only-binary=:all: \
              --index-url https://test.pypi.org/simple/ \
              --dest testpypi-dist \
              "telekinesis-illusion==$VERSION"; then
              echo "Download succeeded"
              break
            fi
            if [ $i -eq 3 ]; then
              echo "Download failed after 3 attempts"
              exit 1
            fi
            echo "Retrying in 10 seconds..."
            sleep 10
          done

      - name: Install downloaded wheel and dependencies from PyPI
        run: python -m pip install --index-url https://pypi.org/simple/ testpypi-dist/*.whl

      - name: Verify imports
        run: |
          set +e

          python -I -c "import bpy; print('bpy import OK', flush=True)"
          BPY_STATUS=$?

          python -I -c "import cv2; print('cv2 import OK', flush=True)"
          CV2_STATUS=$?

          python -I -c "import bpy, cv2; print('bpy + cv2 import OK', flush=True)"
          BPY_CV2_STATUS=$?

          python -I -c "from telekinesis.illusion.core import engine; print('engine import OK', flush=True)"
          ENGINE_STATUS=$?

          echo "bpy: $BPY_STATUS"
          echo "cv2: $CV2_STATUS"
          echo "bpy + cv2: $BPY_CV2_STATUS"
          echo "engine: $ENGINE_STATUS"

          if [ $BPY_STATUS -ne 0 ] || [ $CV2_STATUS -ne 0 ] || [ $BPY_CV2_STATUS -ne 0 ] || [ $ENGINE_STATUS -ne 0 ]; then
            exit 1
          fi

  publish-pypi:
    name: Publish to PyPI
    runs-on: ubuntu-latest
    needs: [build, verify-testpypi]
    environment: pypi
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11.17"

      - name: Safety check — no dev versions on main
        run: |
          VERSION=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          echo "Publishing version $VERSION to PyPI"
          if echo "$VERSION" | grep -q "dev"; then
            echo "Dev version cannot be released on main!"
            exit 1
          fi

      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: release-dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

  post-release-tag:
    name: Tag Release
    runs-on: ubuntu-latest
    needs: publish-pypi
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11.17"

      - name: Create and push git tag
        run: |
          VERSION=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          echo "Tagging release v$VERSION"

          git config user.name "ci-bot"
          git config user.email "ci-bot@telekinesis.ai"
          git fetch --tags

          if git rev-parse "v$VERSION" >/dev/null 2>&1; then
            echo "Tag v$VERSION already exists. Skipping."
            exit 0
          fi

          git tag -a "v$VERSION" -m "Release v$VERSION"
          git push origin "v$VERSION"

  post-release-bump-version:
    name: Bump Version on develop
    runs-on: ubuntu-latest
    needs: publish-pypi
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11.17"

      - name: Install tomli-w
        run: pip install tomli-w

      - name: Bump patch version on develop
        run: |
          VERSION=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          echo "Current version: $VERSION"

          if echo "$VERSION" | grep -q "dev"; then
            echo "Version should not contain dev suffix!"
            exit 1
          fi

          IFS='.' read -r MAJOR MINOR PATCH <<< "$VERSION"
          PATCH=$((PATCH + 1))
          NEW_VERSION="${MAJOR}.${MINOR}.${PATCH}"
          echo "Next development version: $NEW_VERSION"

          git config user.name "ci-bot"
          git config user.email "ci-bot@telekinesis.ai"
          git fetch origin develop
          git checkout -B develop origin/develop

          DEVELOP_VERSION=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          if [ "$DEVELOP_VERSION" != "$VERSION" ]; then
            echo "develop is already at $DEVELOP_VERSION; leaving its version unchanged."
            exit 0
          fi

          NEW_VER="$NEW_VERSION" python -c "
          import os, tomllib, tomli_w
          data = tomllib.load(open('pyproject.toml', 'rb'))
          data['project']['version'] = os.environ['NEW_VER']
          tomli_w.dump(data, open('pyproject.toml', 'wb'))
          "

          git add pyproject.toml
          git commit -m "chore: bump version to $NEW_VERSION [skip ci]"
          git push origin develop
