# Bin picking dataset: four parts dropped into a tape-lined eurobox.

# DatasetConfig
dataset:
  name: bin_picking_0.3.3_v2
  num_images: 5
  output_directory: output
  shard:
    size: 100
    name_template: "shard_{date}_{uuid}"
  writer:
    image_format: JPEG
    jpg_quality: 98
    max_size_gb: 50
    dataset_format: null
    split_ratios: [0.7, 0.2, 0.1]
    split_seed: 42
    stratify: true
    coco:
      description: "Bin picking sim-to-real with telekinesis-illusion."
      url: "https://github.com/telekinesis-ai"
      version: "1.0.0"
      year: 2026
      contributor: "Telekinesis AI"
      licenses:
        - id: 1
          name: "Project asset license"
          url: ""

# RenderConfig
renderer:
  device: CUDA
  samples: 256
  view_transform: AgX
  exposure:
    - -1.6
    - -0.6
  background_strength:
    - 0.585
    - 0.715
  background_rotation:
    - -180
    - 180
  denoiser: null
  color_output: linear

# CameraConfig — calibrated RealSense intrinsics
camera:
  image_width: 848
  image_height: 480
  clip_start: 0.03
  clip_end: 100.0
  intrinsics:
    - 435.46856689453125
    - 434.5237731933594
    - 420.7252502441406
    - 244.55136108398438

# PhysicsConfig
physics:
  active: true
  min_simulation_time_range: [0.5, 0.8]
  max_simulation_time_range: [1.5, 2.5]
  check_model_interval: 0.5
  model_stopped_location_threshold: 0.01
  model_stopped_rotation_threshold: 1.0
  substeps_per_frame: 8
  solver_iters: 10
  verbose: false
  use_volume_com: false

# ModelConfig per entry. Model paths are relative to asset_directory.
models:
  # --- Parts (non-beveled meshes) ---
  - model_name: 50_pin_male_Centronics_connector
    model_path: models/parts/production_parts/50_pin_male_centronics_connector.glb
    groups: [part]
    category_name: 50_pin_male_Centronics_connector
    category_id: 1
    active_in_simulation: true
    collision_shape: CONVEX_HULL
    material_preprocessing: preserve
    shading: AUTO_SMOOTH

  - model_name: black_cable_gland
    model_path:  models/parts/production_parts/black_cable_gland.glb
    groups: [part]
    category_name: black_cable_gland
    category_id: 2
    active_in_simulation: true
    collision_shape: CONVEX_HULL
    material_preprocessing: preserve
    shading: AUTO_SMOOTH

  - model_name: multi_pin_circular_connector
    model_path:  models/parts/production_parts/multi_pin_circular_connector.glb
    groups: [part]
    category_name: multi_pin_circular_connector
    category_id: 3
    active_in_simulation: true
    collision_shape: CONVEX_HULL
    material_preprocessing: preserve
    shading: AUTO_SMOOTH

  - model_name: panel_mount_pilot_light
    model_path:  models/parts/production_parts/panel_mount_pilot_light.glb
    groups: [part]
    category_name: panel_mount_pilot_light
    category_id: 4
    active_in_simulation: true
    collision_shape: CONVEX_HULL
    material_preprocessing: preserve
    shading: AUTO_SMOOTH

  # --- Containers: eurobox with a cloth-simulated tape liner, six variants ---
  - model_name: bin_clothliner0
    model_path: models/environment/bins/eurobox_40x30x12_clothliner0_w.glb
    groups: [container]
    category_name: distractor
    collision_shape: MESH
    material_preprocessing: preserve

  - model_name: bin_clothliner1
    model_path: models/environment/bins/eurobox_40x30x12_clothliner1_w.glb
    groups: [container]
    category_name: distractor
    collision_shape: MESH
    material_preprocessing: preserve

  - model_name: bin_clothliner2
    model_path: models/environment/bins/eurobox_40x30x12_clothliner2_w.glb
    groups: [container]
    category_name: distractor
    collision_shape: MESH
    material_preprocessing: preserve

  - model_name: bin_clothliner3
    model_path: models/environment/bins/eurobox_40x30x12_clothliner3_w.glb
    groups: [container]
    category_name: distractor
    collision_shape: MESH
    material_preprocessing: preserve

  - model_name: bin_clothliner4
    model_path: models/environment/bins/eurobox_40x30x12_clothliner4_w.glb
    groups: [container]
    category_name: distractor
    collision_shape: MESH
    material_preprocessing: preserve

  - model_name: bin_clothliner5
    model_path: models/environment/bins/eurobox_40x30x12_clothliner5_w.glb
    groups: [container]
    category_name: distractor
    collision_shape: MESH
    material_preprocessing: preserve

  # --- Distractors ---
  - model_name: gearwheel_1
    model_path: models/parts/mechanical_parts/gearwheels/gearwheel_1.glb
    groups: [distractor]
    category_name: gearwheel_1
    category_id: 5
    active_in_simulation: true
    collision_shape: CONVEX_HULL
    shading: AUTO_SMOOTH

  - model_name: gearwheel_2
    model_path: models/parts/mechanical_parts/gearwheels/gearwheel_2.glb
    groups: [distractor]
    category_name: gearwheel_2
    category_id: 6
    active_in_simulation: true
    collision_shape: CONVEX_HULL
    shading: AUTO_SMOOTH

  - model_name: pipe_fixture_1
    model_path: models/parts/mechanical_parts/pipes/pipe_fixture_1.glb
    groups: [distractor]
    category_name: pipe_fixture_1
    category_id: 7
    active_in_simulation: true
    collision_shape: CONVEX_HULL
    shading: AUTO_SMOOTH

  # --- Environment ---
  # Two SSI Schaefer LF 211 bins on each long side of the main bin.
  - model_name: neighbors_lleft
    model_path: models/environment/bins/neighbors_lf211_lleft.glb
    groups: [environment]
    category_name: distractor
    collision_shape: BOX
    material_preprocessing: preserve

  - model_name: neighbors_lright
    model_path: models/environment/bins/neighbors_lf211_lright.glb
    groups: [environment]
    category_name: distractor
    collision_shape: BOX
    material_preprocessing: preserve

  - model_name: table
    model_path: models/environment/tables/table.glb
    groups: [environment]
    category_name: distractor
    collision_shape: BOX
    material_preprocessing: preserve

  - model_name: cardboard_neg
    model_path: models/environment/cardboards/cardboard_neg_short.glb
    groups: [environment]
    category_name: distractor
    collision_shape: BOX
    material_preprocessing: preserve

  # Robotiq Hand-E, modeled in camera coordinates.
  - model_name: gripper
    model_path: models/environment/gripper/gripper_hande.glb
    groups: [environment, camera_mount]
    category_name: distractor
    collision_shape: BOX
    material_preprocessing: preserve
    preprocess_model: false

lights:
  - light_name: key
    light_type: AREA
  - light_name: fill
    light_type: AREA

# PoseSamplingConfig
pose_sampling:
  strategy: random
  min_height: 0.03
  max_height: 0.12
  face_sample_range: [0.2, 0.8]

randomizers:
  instance:
    part:
      counts:
        50_pin_male_Centronics_connector: [0, 8]
        black_cable_gland: [0, 8]
        multi_pin_circular_connector: [0, 8]
        panel_mount_pilot_light: [0, 8]
      min_num_total_models: 1
      max_num_total_models: 30
    container:
      counts:
        bin_clothliner0: [0, 1]
        bin_clothliner1: [0, 1]
        bin_clothliner2: [0, 1]
        bin_clothliner3: [0, 1]
        bin_clothliner4: [0, 1]
        bin_clothliner5: [0, 1]
      min_num_total_models: 1
      max_num_total_models: 1
    distractor:
      counts:
        gearwheel_1: [0, 2]
        gearwheel_2: [0, 2]
        pipe_fixture_1: [0, 2]
      min_num_total_models: 0
      max_num_total_models: 3
    environment:
      counts:
        neighbors_lleft: [1, 1]
        neighbors_lright: [1, 1]
        table: [1, 1]
        cardboard_neg: [1, 1]
        gripper: [1, 1]
