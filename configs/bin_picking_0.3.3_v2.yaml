              bump_strength: [0.02, 0.08]
              bump_distance: 0.00005
              scale: [1.0, 3.0]
            parameters:
              base_color:
                - [0.85, 0.85, 0.86, 1.0]
                - [0.95, 0.95, 0.96, 1.0]
              roughness: [0.05, 0.15]
              anisotropic: [0.3, 0.7]
        blue_insulator.004:
